services:
  db_product_0:
    build:
      context: .
      dockerfile: db_product/Dockerfile
    command:
      [
        "python3",
        "db_product/product_server.py",
        "--host",
        "0.0.0.0",
        "--port",
        "6002",
        "--state",
        "/app/data/product.db",
        "--node-id",
        "0",
        "--members",
        "db_product_0:7200,db_product_1:7201,db_product_2:7202,db_product_3:7203,db_product_4:7204",
      ]
    ports:
      - "6201:6002"
    volumes:
      - product_db_0:/app/data

